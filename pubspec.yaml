name: flutter_app
description: "Mystic Cat Journal - 고양이 그림자 정원"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  intl: 0.20.2
  audioplayers: 6.1.0
  google_fonts: 6.2.1
  video_player: 2.9.2
  flutter_local_notifications: 18.0.1
  timezone: 0.9.4
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cards36/
    - assets/mochi/
    - assets/icon/
    - assets/audio/
    - assets/video/
    - assets/video/meditation/
    - assets/nav_icons/
    - assets/growth/
    - assets/growth/teen_frames/
    - assets/growth/adult_frames/
    - assets/onboarding_intro/
