name: flutter_app
description: "Mystic Cat Journal - ??? ??"
publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flame: 1.32.0
  home_widget: 0.9.2+1
  google_mobile_ads: 5.3.1

  characters: ^1.4.0
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  intl: 0.20.2
  audioplayers: 6.1.0
  google_fonts: 6.3.2
  video_player: 2.9.2
  flutter_local_notifications: 18.0.1
  timezone: 0.9.4
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  gal: ^2.3.2

  cryptography: 2.7.0
  file_picker: 8.1.7
  firebase_auth: 5.3.1
  firebase_app_check: 0.3.1+3
  http: 1.2.2
  flutter_secure_storage: ^9.2.4

  # Firebase (Analytics only for now - ?? ??/?? ?? ? ??? ??? ?? ??)
  firebase_core: 3.6.0
  firebase_analytics: 11.3.3
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # Google Play Billing Library 8.0.0 요구사항 충족 (2026-08-31 시행).
  # 상세 이유는 위 in_app_purchase_android 주석 참고.
  in_app_purchase_android: 0.4.0+10

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/mongi/images/
    - assets/mongi/audio/
    - assets/cards36/
    - assets/mochi/
    - assets/icon/
    - assets/audio/
    - assets/audio/meditation/
    - assets/video/
    - assets/video/meditation/
    - assets/nav_icons/
    - assets/growth/
    - assets/growth/teen_frames/
    - assets/growth/adult_frames/
    - assets/onboarding_intro/

  fonts:
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    - family: GamjaFlower
      fonts:
        - asset: assets/fonts/GamjaFlower-Regular.ttf
    - family: NanumPenScript
      fonts:
        - asset: assets/fonts/NanumPenScript-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
